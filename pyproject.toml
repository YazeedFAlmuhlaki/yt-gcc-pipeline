[project]
name = "yt-gcc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yazeed Almuhlaki", email = "yazeed@almuhlaki.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.73",
    "httpx>=0.28.1",
]

[project.scripts]
yt-gcc = "yt_gcc:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "python-dotenv>=1.2.3",
]
